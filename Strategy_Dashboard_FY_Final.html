        // Keys might be out of order, sort them normally or keep as provided. 
        // We know they are FY26-27 down to FY22-23 so Object.keys should preserve insertion order in most JS engines, 
        // but let's just use the keys as they appear.
        const years = Object.keys(dashboardData);
        
        const tabsContainer = document.getElementById('tabs-container');
        const tableHeader = document.getElementById('table-header');
        const tableBody = document.getElementById('table-body');
        
        // Format number with commas and colors
        function formatVal(val, isTotalRow = false) {
            if (val === "" || val === null) return '-';
            const num = Math.round(parseFloat(val));
            if (isNaN(num)) return val;
            
            const formatted = num.toLocaleString('en-IN', { maximumFractionDigits: 0 });
            const weightClass = isTotalRow ? 'font-bold' : 'font-medium';
            if (num > 0) return `<span class="text-emerald-600 ${weightClass}">₹${formatted}</span>`;
            if (num < 0) return `<span class="text-rose-600 ${weightClass}">₹${formatted}</span>`;
            return `<span class="text-slate-400 ${weightClass}">₹0</span>`;
        }

        function renderTable(year) {
            // Update active tab styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.year === year) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            const sheetData = dashboardData[year];
            if (!sheetData) return;
            
            const headers = sheetData.headers;
            const rows = sheetData.rows;
            
            // Build header
            let headerHtml = `<th class="py-3 px-4 strategy-col font-bold text-slate-900 shadow-[inset_-1px_0_0_#e2e8f0]">Strategy Name</th>`;
            headers.forEach(h => {
                headerHtml += `<th class="py-3 px-4 text-right whitespace-nowrap">${h}</th>`;
            });
            headerHtml += `<th class="py-3 px-4 text-right font-bold text-slate-900 bg-slate-50">Total</th>`;
            tableHeader.innerHTML = headerHtml;
            
            // Build body
            tableBody.innerHTML = '';
            if (rows.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${headers.length + 2}" class="py-8 text-center text-slate-500">No data available for this year.</td></tr>`;
                return;
            }
            
            rows.forEach((row) => {
                const isTotalRow = row[0].toLowerCase().includes('total') || row[0].toLowerCase().includes('cumulative');
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50 transition-colors';
                if (isTotalRow) tr.classList.add('bg-slate-50'); // Highlight total row slightly
                
                // Strategy name is fixed on the left
                const nameWeightClass = isTotalRow ? 'font-bold text-slate-900' : 'font-medium text-slate-800';
                let html = `<td class="py-3 px-4 ${nameWeightClass} strategy-col whitespace-nowrap bg-inherit shadow-[inset_-1px_0_0_#e2e8f0]">${row[0]}</td>`;
                
                // Months
                for (let i = 1; i <= 12; i++) {
                    html += `<td class="py-3 px-4 text-right whitespace-nowrap">${formatVal(row[i], isTotalRow)}</td>`;
                }
                
                // Total
                const totalBgClass = isTotalRow ? 'bg-slate-100' : 'bg-slate-50';
                html += `<td class="py-3 px-4 text-right font-bold whitespace-nowrap ${totalBgClass} shadow-[inset_0_-1px_0_#e2e8f0]">${formatVal(row[13], true)}</td>`;
                
                tr.innerHTML = html;
                tableBody.appendChild(tr);
            });
        }

        // Initialize tabs
        years.forEach((year) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn py-4 px-6 text-sm font-medium text-slate-600 focus:outline-none';
            btn.dataset.year = year;
            btn.textContent = year;
            btn.onclick = () => renderTable(year);
            tabsContainer.appendChild(btn);
        });
        
        // Render first tab by default
        if (years.length > 0) {
            renderTable(years[0]);
        }
